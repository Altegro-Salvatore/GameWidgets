name: Build APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Восстанавливаем постоянный ключ из base64
    - name: Decode Keystore
      run: |
        echo "" | base64 -d > app/debug.keystore
      
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2
        cache-disabled: true
        
    - name: Build with Gradle
      run: gradle assembleDebug
      
    - name: Get SHA-1 Fingerprint
      run: |
        echo "========== СКОПИРУЙ СТРОКУ НИЖЕ =========="
        keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
        echo "=========================================="
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
